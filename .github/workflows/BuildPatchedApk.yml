name: Build Patched APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for this build'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to create/update (asset is uploaded with --clobber)'
        required: false
        default: 'v0.6.0-phase5'

env:
  APK_FILE: Instagram-v435.0.0.37.76-patches-v3.8.0.apk
  OUT_APK: Instagram-v435.0.0.37.76-InstaTrueReel-signed.apk
  KS_PASS: instatruereel2026

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android build-tools (zipalign + apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Decode smali (resources passthrough, -r)
        run: |
          echo "Decoding $APK_FILE (10-25 min)..."
          java -Xmx6g -jar apktool.jar d -r -f -o decoded "$APK_FILE" 2>&1 | tail -8
          echo "smali files: $(find decoded -name '*.smali' | wc -l)"
          ls -d decoded/smali* | wc -l

      - name: Apply InstaTrueReel patches (v6, chain liberation + full diagnostics)
        run: |
          python3 patches/apply_patches.py decoded 2>&1 | tee patch_report.txt

      - name: Rebuild APK (apktool b, resources passthrough)
        run: |
          echo "Rebuilding (15-40 min)..."
          java -Xmx6g -jar apktool.jar b decoded -o unsigned.apk 2>&1 | tail -15
          ls -lh unsigned.apk

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 unsigned.apk aligned.apk
          ls -lh aligned.apk

      - name: Sign (apksigner v1+v2+v3)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks signing/instatruereel.jks \
            --ks-key-alias instatruereel \
            --ks-pass pass:$KS_PASS \
            --key-pass pass:$KS_PASS \
            --out "$OUT_APK" \
            aligned.apk
          ls -lh "$OUT_APK"

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$OUT_APK" | head -12

      - name: Verify patches are inside the final APK
        run: |
          mkdir -p finalcheck && cd finalcheck
          unzip -o "../$OUT_APK" classes13.dex classes16.dex classes17.dex >/dev/null
          python3 - <<'EOF'
          import sys
          ok = True
          def check(dex, needle, label):
              global ok
              data = open(dex, 'rb').read()
              found = needle.encode() in data
              print(f"  [{' ok ' if found else 'FAIL'}] {label} ({dex})")
              ok = ok and found
          # classes13 hosts 1fC/1fI + 0bQ/0bI: helper type string proves the
          # interceptor + tab-bar gate call-sites were compiled into the dex.
          check('classes13.dex', 'TTrueReelHelper', 'interceptor + tab-bar gates (1fC/1fI/0bQ/0bI) present')
          # classes16 hosts the helper + reapply + viewsave classes + fragments:
          # v0.6 strings prove the new chain-liberation body is inside.
          check('classes16.dex', 'TTrueReelHelper', 'helper class defined')
          check('classes16.dex', 'TTrueReelReapply', 'reapply runnable present')
          check('classes16.dex', 'TTrueReelViewSave', 'v0.6 view-save state class present')
          check('classes16.dex', 'InstaTrueReel v0.6', 'v0.6 toast marker present')
          check('classes16.dex', 'v0.6 deblock eval', 'v0.6 deblock eval diagnostics present')
          check('classes16.dex', 'v0.6 liberate: ', 'v0.6 chain liberation diagnostics present')
          check('classes16.dex', 'v0.6 liberate: chain freed', 'v0.6 liberation summary present')
          check('classes16.dex', 'v0.6 restore-layout: chain restored', 'v0.6 chain-restore diagnostics present')
          # classes17 hosts 2Iv + 2ZS: helper string proves the lerp gate.
          check('classes17.dex', 'TTrueReelHelper', '2ZS/2Iv gate call-sites present')
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReel-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report
          path: |
            patch_report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create/update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          NOTES=$(cat <<'EON'
          **InstaTrueReel v0.6.0 — chain liberation (every entry point full-bleed).**

          Fixes the two v0.5 field-test failures (16 MB logcat analysis):

          - **Home-feed entry (Context-Preserving Overlay):** the comment-bar area is no
            longer opaque — every container bounding the video is liberated (bottom
            margins + insets padding zeroed while Reels is active), so the video draws
            edge-to-edge behind the comment row, TikTok-style.
          - **Watch History / Liked (ModalActivity):** the black status-bar strip is gone —
            the modal root's `fitsSystemWindows` insets padding is removed while Reels is
            active, so the video runs under the (now transparent) status and nav bars.
          - One generic mechanism replaces the fragile hardcoded view-id surgery: the new
            **chain liberation walk** (helper A09/A11) walks from the reels fragment's own
            view up to the window decor, saves each ancestor's state, zeroes it, and
            restores everything on exit. No view ids involved — works on every entry path.
          - **Full diagnostics:** `adb logcat -s InstaTrueReel` now prints
            `v0.6 deblock eval:`, `v0.6 liberate: <class> t=.. b=.. mb=.. fits=..` detail
            lines and `v0.6 liberate: chain freed (n=..)` summaries; every exception is
            logged (v0.5's silent no-ops can never happen again).
          - Install: **fully uninstall the previous build first** (signature change), then
            install this APK. Verify with the toast: `InstaTrueReel v0.6: full-bleed
            everywhere ON`.

          ${{ github.event.inputs.notes }}
          EON
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - uploading asset (clobbering old one)."
            gh release upload "$TAG" "$OUT_APK" --clobber
          else
            gh release create "$TAG" "$OUT_APK" \
              --title "InstaTrueReel $TAG - chain liberation (all entry points)" \
              --notes "$NOTES"
          fi

      - name: Summary
        run: |
          {
            echo "## InstaTrueReel Build (v0.6 — chain liberation + full diagnostics)"
            echo ""
            echo "- Input: \`$APK_FILE\`"
            echo "- Output: \`$OUT_APK\` ($(ls -lh "$OUT_APK" 2>/dev/null | awk '{print $5}'))"
            echo "- Core patch: 9Wz.EEr() forced true (IG native edge-to-edge reels mode)"
            echo "- Interceptors: 1fC.A04 (status bar) + 1fI.A04 (nav bar)"
            echo "- NEW v0.6: chain liberation walk - zero padding/margins/fitsSystemWindows on"
            echo "  every ancestor of the reels view while active (fixes ModalActivity + feed path)"
            echo "- NEW v0.6: X/TTrueReelViewSave state class + full diagnostic logging"
            echo "- Release tag: ${{ github.event.inputs.release_tag }}"
            echo "- Notes: ${{ github.event.inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
