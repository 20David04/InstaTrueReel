name: Build Patched APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for this build'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to create/update (asset is uploaded with --clobber)'
        required: false
        default: 'v0.8.0-phase7'

env:
  APK_FILE: Instagram-v435.0.0.37.76-patches-v3.8.0.apk
  OUT_APK: Instagram-v435.0.0.37.76-InstaTrueReel-signed.apk
  KS_PASS: instatruereel2026

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android build-tools (zipalign + apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Decode smali (resources passthrough, -r)
        run: |
          echo "Decoding $APK_FILE (10-25 min)..."
          java -Xmx6g -jar apktool.jar d -r -f -o decoded "$APK_FILE" 2>&1 | tail -8
          echo "smali files: $(find decoded -name '*.smali' | wc -l)"
          ls -d decoded/smali* | wc -l

      - name: Apply InstaTrueReel patches (v8, strip-overlay transformation)
        run: |
          python3 patches/apply_patches.py decoded 2>&1 | tee patch_report.txt

      - name: Rebuild APK (apktool b, resources passthrough)
        run: |
          echo "Rebuilding (15-40 min)..."
          java -Xmx6g -jar apktool.jar b decoded -o unsigned.apk 2>&1 | tail -15
          ls -lh unsigned.apk

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 unsigned.apk aligned.apk
          ls -lh aligned.apk

      - name: Sign (apksigner v1+v2+v3)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks signing/instatruereel.jks \
            --ks-key-alias instatruereel \
            --ks-pass pass:$KS_PASS \
            --key-pass pass:$KS_PASS \
            --out "$OUT_APK" \
            aligned.apk
          ls -lh "$OUT_APK"

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$OUT_APK" | head -12

      - name: Verify patches are inside the final APK
        run: |
          mkdir -p finalcheck && cd finalcheck
          unzip -o "../$OUT_APK" classes13.dex classes16.dex classes17.dex >/dev/null
          python3 - <<'EOF'
          import sys
          ok = True
          def check(dex, needle, label):
              global ok
              data = open(dex, 'rb').read()
              found = needle.encode() in data
              print(f"  [{' ok ' if found else 'FAIL'}] {label} ({dex})")
              ok = ok and found
          # classes13 hosts 1fC/1fI + 0bQ/0bI: helper type string proves the
          # interceptor + tab-bar gate call-sites were compiled into the dex.
          check('classes13.dex', 'TTrueReelHelper', 'interceptor + tab-bar gates (1fC/1fI/0bQ/0bI) present')
          # classes16 hosts the helper + reapply + viewsave classes + fragments:
          # v0.7 strings prove the gap-closure + telemetry body is inside.
          check('classes16.dex', 'TTrueReelHelper', 'helper class defined')
          check('classes16.dex', 'TTrueReelReapply', 'reapply runnable present')
          check('classes16.dex', 'TTrueReelViewSave', 'v0.6 view-save state class present')
          check('classes16.dex', 'InstaTrueReel v0.8', 'v0.8 toast marker present')
          check('classes16.dex', 'v0.7 liberate: ', 'v0.7 liberation + height telemetry present')
          check('classes16.dex', 'v0.7 liberate: chain freed', 'v0.7 liberation summary present')
          check('classes16.dex', 'v0.7 close: ', 'v0.7 gap-closure diagnostics present')
          check('classes16.dex', 'v0.7 gaps closed (n=', 'v0.7 gap-closure summary present')
          check('classes16.dex', 'v0.7 tree: dump complete (n=', 'v0.7 bottom-strip dump present')
          check('classes16.dex', 'v0.7 restore-layout: heights restored', 'v0.7 height-restore present')
          check('classes16.dex', 'v0.6 restore-layout: chain restored', 'v0.6 chain-restore diagnostics present')
          check('classes16.dex', 'v0.8 overlay: ', 'v0.8 strip-overlay telemetry present')
          check('classes16.dex', 'v0.8 restore: strip overlay reverted', 'v0.8 overlay-restore present')
          check('classes16.dex', 'GestureManagerFrameLayout', 'v0.8 video-container finder present')
          check('classes16.dex', 'ClipsSwipeRefreshLayout', 'v0.8 fallback finder present')
          check('classes16.dex', 'v0.8 apply: edge-to-edge engaged', 'v0.8 apply marker present')
          # classes17 hosts 2Iv + 2ZS: helper string proves the lerp gate.
          check('classes17.dex', 'TTrueReelHelper', '2ZS/2Iv gate call-sites present')
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReel-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report
          path: |
            patch_report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create/update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          NOTES=$(cat <<'EON'
          **InstaTrueReel v0.8.0 — strip-overlay transformation (the comment-bar fix).**

          Field test of v0.7 (log.txt + Screenshot_20260914-155851.jpg,
          home-feed entry): the v0.7 strip dump NAMED the culprit — inside
          the reels fragment root (vertical IgLinearLayout 0x7f0b0bbd), the
          video stack (GestureManagerFrameLayout 0x7f0b1b41) is a weighted
          child that stops at y=1762, and the opaque comment strip
          (IgLinearLayout 0x7f0b0b96, 158px, #0c1014, containing the rounded
          "Add comment..." pill 0x7f0b0d72) is stacked BELOW it as a sibling.
          The ancestor chain was already fully liberated by v0.6/v0.7 — the
          bound lives INSIDE the fragment, below the fragment view, where no
          ancestor-walk can ever reach it.

          v0.8 transforms that strip into a TikTok-style floating overlay:
          - **Video full-bleed:** video LayoutParams.height = fragment-root
            height, LinearLayout weight ZEROED (a weighted child is
            re-measured to the leftover space — the weight must go or the
            height change is silently undone).
          - **Strip overlay:** translationY = -158 keeps the strip at the
            exact same on-screen position, now floating ON TOP of the
            full-height video (later sibling = drawn on top; touch dispatch
            follows translation, so the pill stays tappable).
          - **Transparency:** strip + direct-child backgrounds cleared; the
            rounded pill two levels down keeps its background — "Add
            comment..." pill floating over fullscreen video, like TikTok.
          - Inert by design on the reels tab (no strip gap). Everything
            saved once and restored on exit; idempotent re-assert on every
            re-apply tick (100/400/1000/2500 ms).

          Install over v0.7 (signature unchanged). Verify with the toast:
          `InstaTrueReel v0.8: strip-overlay ON`. Same fix covers home-feed,
          Watch History and Likes entries (same fragment, same strip). If
          anything is still off, a small `adb logcat -s InstaTrueReel`
          capture now shows `v0.8 overlay:` / `v0.8 restore:` lines naming
          exactly what happened.

          ${{ github.event.inputs.notes }}
          EON
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - uploading asset (clobbering old one)."
            gh release upload "$TAG" "$OUT_APK" --clobber
          else
            gh release create "$TAG" "$OUT_APK" \
              --title "InstaTrueReel $TAG - strip-overlay transformation" \
              --notes "$NOTES"
          fi

      - name: Summary
        run: |
          {
            echo "## InstaTrueReel Build (v0.8 — strip-overlay transformation)"
            echo ""
            echo "- Input: \`$APK_FILE\`"
            echo "- Output: \`$OUT_APK\` ($(ls -lh "$OUT_APK" 2>/dev/null | awk '{print $5}'))"
            echo "- Core patch: 9Wz.EEr() forced true (IG native edge-to-edge reels mode)"
            echo "- Interceptors: 1fC.A04 (status bar) + 1fI.A04 (nav bar)"
            echo "- v0.6 kept: chain liberation walk (STATUS BAR FIXED everywhere)"
            echo "- v0.7 kept: bottom-gap closure A15/A16 (exact-height surgery, top-down,"
            echo "  cascading via re-apply ticks) + h=/ph= height telemetry"
            echo "- v0.7 kept: A17/A18 one-shot bottom-strip tree dump (culprit naming)"
            echo "- NEW v0.8: strip overlay A19/A1A/A1B/A1C/A1D/A1E (video full-height"
            echo "  + weight=0; comment strip -> floating transparent overlay; pill kept)"
            echo "- Release tag: ${{ github.event.inputs.release_tag }}"
            echo "- Notes: ${{ github.event.inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
